<main class="login-page">

  <div class="login-card">

    <h1>Prijava</h1>

    <p class="subtitle">
      Prijavite se na svoj DreamLand Toys nalog
    </p>


    <label>
      Email

      <input
        type="email"
        [(ngModel)]="email"
        placeholder="Email"
      >
    </label>


    <label>
      Lozinka

      <input
        type="password"
        [(ngModel)]="password"
        placeholder="Lozinka"
      >
    </label>


    @if (error()) {
      <p class="error">
        {{ error() }}
      </p>
    }


    <button
      type="button"
      (click)="login()"
    >
      Prijavi se
    </button>


    <p class="register-link">
      Nemate nalog?

      <a routerLink="/signup">
        Registrujte se
      </a>
    </p>

  </div>

</main>
